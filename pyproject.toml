[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "partkit"
version = "0.1.0"
description = "Find, import and manage Altium Designer parts: CAD zips, 3D models, reusable passives and clean BOMs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "olefile>=0.46",
  "typer>=0.12",
  "rich>=13",
  "watchdog>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
partkit = "partkit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
partkit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
