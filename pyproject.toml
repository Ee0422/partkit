[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "partkit"
version = "1.0.0"
description = "Find, import and manage Altium Designer parts: CAD zips, 3D models, reusable passives and clean BOMs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "olefile>=0.46",
  "typer>=0.12",
  "rich>=13",
  "keyring>=24",
  "watchdog>=4",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=8", "PySide6>=6.5"]

[project.scripts]
partkit = "partkit.cli:app"

[project.gui-scripts]
partkit-gui = "partkit.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
partkit = ["altium/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
